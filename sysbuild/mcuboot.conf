# Added to MCUboot's own configuration (sysbuild picks this file up by
# name). The bootloader has 48 kB; everything here is about staying in it.

# No UART on this board, and nobody to read a bootloader log on a sealed
# ring. Not RTT either: the app's RTT control block would then have a stale
# twin from the bootloader, and pyocd rtt can latch onto the wrong one.
#
# MCUboot's own prj.conf sets LOG_MODE_MINIMAL, MCUBOOT_LOG_LEVEL_INF and
# LOG_DEFAULT_LEVEL, so turning LOG off here leaves three Kconfig warnings
# about those choices going unsatisfied. They are expected and harmless.
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n

# The board defconfig turns these on for the app; MCUboot uses none of
# them.
CONFIG_I2C=n
CONFIG_ADC=n
CONFIG_REGULATOR=n

CONFIG_SIZE_OPTIMIZATIONS=y

# Not CONFIG_DISABLE_FLASH_PATCH, despite the build's "integrity of secure
# boot" banner: it works by writing UICR, which also turns breakpoints off
# for the app until the next full erase. Anyone with SWD on this board can
# reflash it outright anyway.

# The LZMA2 dictionary defaults to 128 kB of static RAM -- the whole of the
# nRF52833's RAM. 64 kB costs a few percent of compression on a ~245 kB
# image. Must equal the app's value in prj.conf, which is what imgtool
# compresses with.
CONFIG_NRF_COMPRESS_LZMA_MAX_DICT_SIZE=65536

# ECDSA stays on TinyCrypt, which NCS 3.4 marks deprecated (one more
# expected Kconfig warning). CONFIG_BOOT_ECDSA_NRF_OBERON was tried and
# does not build for this nRF52833 MCUboot: ocrypto_sha256.h not found.
