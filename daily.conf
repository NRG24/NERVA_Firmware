# Daily-wear build: the ring measures on its own, lightly, and keeps a
# history in flash for the phone app to sync -- so the phone does not have
# to stay connected for anything to be recorded.
#
#   .\build.ps1 -Daily       -> build-daily\ring-fw\zephyr\zephyr.hex
#
# The difference from production is power and range, not features.

# One 25 s heart-rate window every 10 minutes (~4 % duty) instead of every
# minute (~42 %). Every window lands in the 5-minute history record it falls
# in, so roughly every other record carries a heart rate. The app can tighten
# this at runtime with opcode 0x04 while it is open.
CONFIG_RING_MEASURE_PERIOD_S=600

# Red held on while charging.
CONFIG_RING_CHARGE_LED=y

# +8 dBm: the antenna is untuned and a phone in a pocket is further away
# than a PC on a desk. See hr-test.conf.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
