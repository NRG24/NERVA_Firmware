# Production build: what the v0.6 test campaign (2026-10-07 to 10-12)
# taught, applied. The plain `.\build.ps1` uses this, into build\.
#
# Everything the test builds have that production needs is already in the
# shared source: the on-ring history, the spectral heart-rate detector, the
# 31 mA / 4x-averaged PPG front end, 25 s windows, the inherited-watchdog
# fix, and the rhythm-gated step counter. This file only sets what differs.
#
# The test firmware itself is frozen in ../ring-fw-test-v0.6.2.

# The antenna is untuned and measured ~17 dB below a WHOOP (-79 dBm against
# -62 at the same spot); a Windows link dropped within seconds at -80 to
# -89 dBm. +8 dBm is the nRF52833's maximum. Until the antenna is retuned,
# a link that holds matters more than the radio current.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# One 25 s heart-rate window every 5 minutes (~8 % duty): one per history
# record. The default 60 s period with 25 s windows would be ~42 % duty,
# and the LED plus the 5 V boost dominate the power budget. An app can still
# tighten it while it is open (opcode 0x04).
CONFIG_RING_MEASURE_PERIOD_S=300

# Red held on while charging.
CONFIG_RING_CHARGE_LED=y

# No GSR sampling for the status packet: the front end cannot resolve skin
# conductance on this board, and its 800 ms settle stalled the step counter
# every 30 s. See CONFIG_RING_GSR_STATUS.
CONFIG_RING_GSR_STATUS=n

# No diagnostic opcodes (0x10 PPG tune, 0x11 TX power). 0x11 needs the
# controller's dynamic TX power command, so that goes too.
CONFIG_RING_DIAG_OPCODES=n
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=n

# Advertise fast for 30 s after boot or a disconnect, then every ~1 s.
# Fast advertising all day is likely several mAh a day at +8 dBm.
CONFIG_RING_ADV_SLOW_AFTER_S=30

# Ask for a ~100 ms / latency-4 connection while idle, 15-30 ms while
# streaming or syncing history, instead of the central's 15-30 ms always.
CONFIG_RING_CONN_PARAM_MGMT=y

# PPG front end at a quarter of the test builds' LED energy: ~15 mA, 2x
# averaging, instead of ~31 mA, 4x. PROVISIONAL -- the 2026-10-08 sweep
# could not separate the settings; tools/ppg_sweep.py --ab decides. At 25 s
# every 300 s the test setting alone is ~7-8 mAh a day (POWER.md).
CONFIG_RING_PPG_LED_PA=128
CONFIG_RING_PPG_AVG_LOG2=1

# Accelerometer in low-power mode at 60 Hz (~20 uA) instead of
# high-performance at 120 Hz (~190 uA, all day). Must be verified on the
# first prod flash: wake-on-motion still fires, steps still count.
CONFIG_RING_IMU_LOW_POWER=y

# ble_service() owns the connection interval, so Zephyr's own automatic
# request (its preferred 30-50 ms, latency 0, 5 s after connecting) must
# not race it. The preferred parameters a central can read from the GAP
# service say the same as the idle request: 75-105 ms, latency 4, 4 s.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=60
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=84
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Spot readings for the app's stress and burnout scores: a 3-minute green
# window every hour asleep and at most every hour awake and still. ~5 %
# extra LED duty at night, less by day. See src/spot.h.
CONFIG_RING_SPOT_NIGHT_MIN=60
CONFIG_RING_SPOT_DAY_MIN=60

# Hot-flash detection from the ring temperature, while asleep only.
# UNVALIDATED threshold; see src/thermo.h.
CONFIG_RING_HOT_FLASH_MODE=1
