# Sysbuild: MCUboot in front of the app, for over-the-air updates (OTA.md).
#
# Overwrite-only, because two full image slots do not fit beside the
# history log in 512 kB (see the partitions in the board DTS). That mode
# has no revert: MCUboot checks the update's signature and hash before it
# copies, so a damaged or foreign upload is refused and the old image
# keeps running, but a correctly signed image that is broken in itself
# stays installed. Try every release on an unsealed board first.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# The update is LZMA2-compressed so it fits the 176 kB secondary slot,
# which is the history partition.
SB_CONFIG_MCUBOOT_COMPRESSED_IMAGE_SUPPORT=y

# ECDSA P-256 with this project's own key, not MCUboot's published
# development key -- anyone holding that one could sign an image this
# ring would accept. keys/ is gitignored: keep a copy of the key
# somewhere safe, because without it no sealed ring can be updated again.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APP_DIR}/keys/ring-mcuboot-ecdsa-p256.pem"
