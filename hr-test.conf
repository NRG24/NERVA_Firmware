# Heart-rate test build: PPG runs continuously, live BPM over the standard
# Heart Rate Service, no pairing needed. Bench use only -- see
# CONFIG_RING_HR_CONTINUOUS in Kconfig.
#
#   .\build.ps1 -HrTest      -> build-hrtest\ring-fw\zephyr\zephyr.hex
#
# Read it with tools/live_hr.py, or any HRS app (nRF Toolbox -> HRM).

CONFIG_RING_HR_CONTINUOUS=y

# Red held on while charging, back to green measurement when unplugged.
CONFIG_RING_CHARGE_LED=y

# +8 dBm, the nRF52833's maximum, up from the 0 dBm default. The antenna is
# untuned and the ring measured ~16 dB below a WHOOP at the same spot, so
# the streaming link to a PC drops within seconds at 0 dBm. Costs radio
# current on every packet; production stays at 0 dBm until the antenna is
# tuned and the trade is measured.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
