CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# There is no UART on this board -- SWD is the only wire out, so the console
# and the log backend both go over SEGGER RTT.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=4096

# The default 1 kB SEGGER RTT up-buffer overflows during boot and silently
# drops log lines -- the IMU init and wake readback landed in the gap. The
# backend drops rather than blocks, so this is invisible except as missing
# timestamps. 8 kB covers the whole boot sequence.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

CONFIG_MAIN_STACK_SIZE=2048

# GSR analog front end
CONFIG_ADC=y

# --- Bluetooth: standard Heart Rate Monitor peripheral ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Ring PPG"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_HRS=y
CONFIG_BT_BAS=y
CONFIG_BT_SMP=y
CONFIG_BT_MAX_CONN=1

# No 32.768 kHz crystal on this board, so the controller runs its sleep
# clock from the internal RC (CLOCK_CONTROL_NRF_K32SRC_RC in the board
# defconfig). BLE tolerates the lower accuracy; it just widens receive
# windows slightly and costs a little power.

# Larger ATT MTU so raw PPG streaming is not capped at 4 samples per packet
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_GATT_DYNAMIC_DB=n

# --- survivability ---------------------------------------------------------
#
# A fatal error (bus fault, stack overflow, failed assert) used to spin
# forever in k_fatal_halt: a dead ring that only a power cycle cleared, and
# on a sealed board that means waiting for the battery to run down. Reboot
# instead. Zephyr's z_fatal_error() calls LOG_PANIC() first, so the fault
# dump is flushed synchronously over RTT before the reset lands.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y

# Reset cause survives the reset and is read back at boot -- the only way to
# tell a watchdog reset from someone plugging in a charger. See main.c.
CONFIG_HWINFO=y

# Stack overflow is caught by the MPU guard, which the board defconfig
# already enables (CONFIG_ARM_MPU + CONFIG_HW_STACK_PROTECTION). With the
# MPU doing it, CONFIG_STACK_SENTINEL would only add a slower, weaker second
# check, so it is deliberately left off.
