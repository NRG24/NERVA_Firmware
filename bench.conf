# Bench instrumentation.
#
#   .\build.ps1 -Bench
#
# Turns on every diagnostic that is compiled out of a normal build. All of
# these perturb what they measure or defeat the power model, so this is for
# a board on a desk with a debugger attached and nothing else.
#
# What this changes:
#   - green LED1 held solid as a power indicator, 5 V boost never sleeps
#   - IMU wake diagnostics, which read latched registers and pulse INT1
#   - live GSR monitor, which holds GSR_PWR on continuously
#   - the full boot self-test suite (battery, IMU, GSR sweeps, pin probes)
#
# This reproduces the behaviour of the archived v0.1-bench green-LED image.

CONFIG_RING_BENCH=y
