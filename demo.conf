# Demo build: the ring stays dark and idle until the dashboard switches the
# green PPG on, so it lasts a day of being carried around and still shows
# live heart rate on cue. Not a shipping configuration -- see
# CONFIG_RING_PPG_ON_DEMAND in Kconfig.
#
#   .\build.ps1 -Demo        -> build-demo\ring-fw\zephyr\zephyr.hex
#
# Control it with tools/dashboard.py (the "Green PPG" button).

# No automatic measurement windows; only the app opens one.
CONFIG_RING_PPG_ON_DEMAND=y

# The sleep wear check opens short PPG windows on its own at night. Off, so
# nothing lights the LED except the app.
CONFIG_RING_SLEEP_WEAR_CHECK=n

# Red held on while charging.
CONFIG_RING_CHARGE_LED=y

# +8 dBm: the antenna is untuned, and a demo link that drops is worse than
# the extra radio current. See hr-test.conf.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
